; STM32F769NI DMA controllers
;
; Both DMA1 and DMA2 are always present and safe to enable together - opening
; a stream (not creating the context) is what actually reserves hardware, so
; listing both controllers here does not by itself claim anything a UART/SPI/
; etc. port might also need.
;
; DMA1 cannot perform memory-to-memory transfers (hardware limitation - see
; dmdma_port_supports_memory_to_memory()); DMA2 can.

[dma1]
driver_name=dmdma
driver_order=2
controller=0

[dma2]
driver_name=dmdma
driver_order=2
controller=1
