; ESP32-S3: the GDMA, one controller with 5 streams (/dev/dmdma0/0 .. 4), memory-to-memory capable.
; Opening a stream (not creating the context) reserves hardware. The buffers of a transfer have to be in the internal RAM
; (docs/port-implementation.md); `request` of a peripheral transfer is its PERI_SEL.
[dma]
driver_name=dmdma
driver_order=2
controller=0
